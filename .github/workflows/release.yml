name: Release

# Tagging is the release trigger: `git tag v0.2.0 && git push origin v0.2.0`.
#
# The published assets are the Python wheel and sdist. They install with
# `uv tool install` on any machine that has MSYS2, which is enough for every
# command: the MSYS2-specific behaviour (device enumeration via /dev/disk/by-id,
# and POSIX path handling) comes from the environment the tool runs in, not
# from anything bundled with it.
#
# A self-contained MSYS2 bundle is deliberately NOT built here. Packaging a
# ~290 MB, ~16k-file runtime failed repeatedly on steps unrelated to this
# project, and shipping a wheel that installs in seconds is worth more than
# shipping nothing. See docs/design.md for the trade-off.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  # Do not publish artifacts for a commit that does not pass its own tests.
  verify:
    name: verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run python -m unittest discover -s tests -t . -v
      - run: uvx ruff check src tests
      - run: uvx ruff format --check src tests

  # Build and smoke-test the distributions, then prove they install cleanly.
  dist:
    name: build and verify distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build the wheel and sdist
        run: uv build

      - name: Check the distribution metadata
        run: uvx twine check dist/*

      - name: Install the wheel and run it
        run: |
          uv tool install --force --from dist/*.whl msys2-tree-size
          "$(uv tool dir --bin)/msys2-tree-size" --version
          "$(uv tool dir --bin)/msys2-tree-size" diagnose
          "$(uv tool dir --bin)/msys2-tree-size" du . --flat --top 3

      - name: Install the sdist and run it
        run: |
          uv tool install --force --from dist/*.tar.gz msys2-tree-size
          "$(uv tool dir --bin)/msys2-tree-size" --version

      - name: Confirm the wheel contains every module
        run: |
          python - <<'PY'
          import glob, sys, zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          expected = {
              "__init__", "archive", "cli", "devices", "duplicates",
              "formats", "hashing", "paths", "report", "sizes", "walk",
          }
          present = {
              n.rsplit("/", 1)[-1][:-3]
              for n in names
              if n.startswith("msys2_tree_size/") and n.endswith(".py")
          }
          missing = expected - present
          if missing:
              sys.exit(f"wheel is missing modules: {sorted(missing)}")
          stray = [n for n in names if any(
              x in n for x in (".venv", ".uv-cache", "__pycache__", ".tmp/"))]
          if stray:
              sys.exit(f"wheel contains build residue: {stray}")
          print(f"wheel ok: {len(present)} modules, no build residue")
          PY

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish the release
    needs: dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: List the assets
        run: ls -la dist

      - name: Attach the distributions to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
