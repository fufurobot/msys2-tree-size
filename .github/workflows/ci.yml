name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: pure-Python logic on Linux.
  test-linux:
    name: unit tests (ubuntu-latest, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run unittest suite
        run: uv run --python ${{ matrix.python-version }} --with pandas --with tqdm python -m unittest discover -s tests -v

      - name: Run packaging smoke test
        run: uv run --python ${{ matrix.python-version }} python -m msys2_tree_size.cli --help

  # The real target environment: MSYS2 provides POSIX byte paths, /dev/disk/by-id
  # and /proc/partitions, which is the entire premise of this project.
  test-msys2:
    name: unit tests (MSYS2 ${{ matrix.msystem }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        msystem: [UCRT64, CLANG64, MINGW64]
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            python
            python-pip

      - name: Run unittest suite under MSYS2
        shell: msys2 {0}
        run: python -m unittest discover -s tests -v

      - name: Verify POSIX device paths are exposed
        shell: msys2 {0}
        run: |
          ls -d /dev/disk/by-id 2>/dev/null || echo "note: /dev/disk/by-id absent in CI container"
          head -n 2 /proc/partitions || echo "note: /proc/partitions absent in CI container"

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check src tests
      - run: uvx ruff format --check src tests
